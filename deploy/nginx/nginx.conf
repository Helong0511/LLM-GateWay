worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 4m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/event-stream;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    upstream forge_web {
        server web:3000;
    }

    upstream forge_api {
        server api:8000;
    }

    server {
        listen 80;
        server_name _;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Request-Id $request_id always;

        # 全站统一写入真实客户端 IP。放在 server 级，location 会继承，
        # 避免再出现「/v1/ 段漏写 XFF」这类只影响一条链路的问题。
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location = /healthz {
            proxy_pass http://forge_api;
        }

        location = /readyz {
            proxy_pass http://forge_api;
        }

        # OpenAI 兼容模型入口。这是协议路径，不是业务 API 的版本号。业务接口走前端的 /api，不再使用 /api/v1。
        location /v1/ {
            proxy_pass http://forge_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 180s;
        }

        location / {
            proxy_pass http://forge_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
