worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 4m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/event-stream;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    # 边缘限流：先按来源 IP 粗挡一层，避免刷接口流量打到应用层。
    # 应用层仍按用户 / API Key 做精确的 RPM/TPM 与并发限制，这里只做「防雪崩」。
    # 注意：若前面再挂 CDN，$binary_remote_addr 会变成 CDN 节点 IP，需要改用 real_ip 模块。
    limit_req_zone $binary_remote_addr zone=edge_auth:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=edge_api:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=edge_conn:10m;
    limit_req_status 429;
    limit_conn_status 429;

    upstream forge_web {
        server web:3000;
    }

    upstream forge_api {
        server api:8000;
    }

    server {
        listen 80;
        server_name _;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Request-Id $request_id always;

        # 全站统一写入真实客户端 IP。放在 server 级，location 会继承，
        # 避免再出现「/v1/ 段漏写 XFF」这类只影响一条链路的问题。
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location = /healthz {
            proxy_pass http://forge_api;
        }

        location = /readyz {
            proxy_pass http://forge_api;
        }

        # OpenAI 兼容模型入口。这是协议路径，不是业务 API 的版本号。业务接口走前端的 /api，不再使用 /api/v1。
        location /v1/ {
            proxy_pass http://forge_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            # 长上下文 / reasoning 模型的流式生成可能远超 180 秒；
            # 读超时过短会在生成中途掐断 SSE，客户端表现为「输出到一半停了」。
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            limit_req zone=edge_api burst=60 nodelay;
            limit_conn edge_conn 64;
        }

        # 登录 / 注册 / 找回密码：低频且最容易被撞库，单独收紧。
        location /api/auth/ {
            limit_req zone=edge_auth burst=10 nodelay;
            proxy_pass http://forge_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            limit_req zone=edge_api burst=120 nodelay;
            limit_conn edge_conn 128;
            proxy_pass http://forge_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # nginx 的 proxy_set_header 是「本层定义了就不再继承上层」，
            # 不显式补 X-Real-IP 会让这条链路丢掉它。
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
