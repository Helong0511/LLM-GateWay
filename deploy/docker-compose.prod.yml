# 生产编排。密钥只来自 env_file，不写在本文件。
# 启动：docker compose --env-file .env -f deploy/docker-compose.prod.yml up --build
# 本文件强制关闭 mock 支付和演示模型。数据库与 Redis 不映射到宿主机公网。
name: forge

services:
  postgres:
    image: postgres:16.10-alpine
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - forge_pg:/var/lib/postgresql/data
      - ../sql/00_create_litellm_database.sql:/docker-entrypoint-initdb.d/01-litellm.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  redis:
    image: redis:7.4.2-alpine
    command: [ "redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}" ]
    volumes:
      - forge_redis:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  litellm:
    image: ghcr.io/berriai/litellm:v1.106.5
    command: [ "--config", "/app/config.yaml", "--port", "4000" ]
    env_file:
      - ../.env
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/litellm
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      APP_ENV: production
      MOCK_PAYMENTS_ENABLED: "false"
      DEMO_MODELS_ENABLED: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # 限流/并发闸单独 db1：与 arq 队列(db0)分开，避免缓存淘汰误伤待执行任务。
      REDIS_RATE_LIMIT_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      # 每多一个 worker，PG 连接就多一份 (POOL_SIZE + MAX_OVERFLOW)。
      # 2 workers × (3+5) = 16，加上 worker 进程与 LiteLLM 仍远低于 max_connections=100。
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-3}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      LITELLM_BASE_URL: http://litellm:4000
      SESSION_IDLE_HOURS: ${SESSION_IDLE_HOURS:-12}
      SESSION_ABSOLUTE_HOURS: ${SESSION_ABSOLUTE_HOURS:-168}
      PG_DUMP_PATH: ${PG_DUMP_PATH:-}
      BACKUP_DOCKER_IMAGE: ${BACKUP_DOCKER_IMAGE:-postgres:16.10-alpine}
      BACKUP_ALLOW_DOCKER: ${BACKUP_ALLOW_DOCKER:-false}
      # 留空则备份为明文；密钥用 `python -c "from cryptography.fernet import Fernet;print(Fernet.generate_key().decode())"` 生成。
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)" ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

  worker:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    command: [ "uv", "run", "--frozen", "--no-dev", "arq", "app.worker.WorkerSettings" ]
    env_file:
      - ../.env
    environment:
      APP_ENV: production
      MOCK_PAYMENTS_ENABLED: "false"
      DEMO_MODELS_ENABLED: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      LITELLM_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/litellm
      LITELLM_LOG_RETENTION_DAYS: ${LITELLM_LOG_RETENTION_DAYS:-30}
      SESSION_IDLE_HOURS: ${SESSION_IDLE_HOURS:-12}
      SESSION_ABSOLUTE_HOURS: ${SESSION_ABSOLUTE_HOURS:-168}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      - api
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  nginx:
    image: nginx:1.27.5-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
      - api
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

volumes:
  forge_pg:
  forge_redis:
