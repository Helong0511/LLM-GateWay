[project]
name = "forge-api"
version = "0.1.0"
description = "算力中转站业务后端"
requires-python = ">=3.12"
# redis 钉在 5.3.1 这条稳定线：当前稳定版 arq 0.28 声明 redis>=4.2,<6，不能升到 6/7/8。
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "pydantic-settings>=2.16.1",
    "sqlalchemy[asyncio]>=2.1.6",
    "asyncpg>=0.32.0",
    "alembic>=1.20.1",
    "redis>=5.3.1,<6",
    "arq>=0.28.0",
    "structlog>=26.1.0",
    "httpx>=0.28.1",
    "pwdlib[argon2]>=0.3.1",
    "pyotp>=2.10.0",
    "cryptography>=50.0.2",
    "aiosmtplib>=5.1.3",
    "tzdata>=2026.5",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "aiosqlite>=0.22.1",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app/auth/router.py" = ["B008"]
"app/auth/deps.py" = ["B008"]
"app/admin/router.py" = ["B008"]
"app/keys/router.py" = ["B008"]
"app/notify/router.py" = ["B008"]
"app/providers/router.py" = ["B008"]
"app/billing/router.py" = ["B008"]
"app/payments/router.py" = ["B008"]
"app/ops/router.py" = ["B008"]
"app/crud_ext/router.py" = ["B008"]
"app/gateway/router.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
packages = ["app"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["arq.*", "asyncpg.*"]
ignore_missing_imports = true
